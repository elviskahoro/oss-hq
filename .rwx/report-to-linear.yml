# Post a finding to Linear (create or comment, deduped by REPORT_KEY) via Dagger.
# Run: rwx run .rwx/report-to-linear.yml --init key=check-closed-issues --init title="..." --init body="..."
# Secret in the RWX vault: LINEAR_API_KEY. Never printed (passed as a Dagger Secret).
on:
  cli:
    init:
      commit-sha: ${{ event.git.sha }}
      team: AI
      key: ""
      title: ""
      body: ""

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.4.1
    with:
      repository: https://github.com/elviskahoro/oss-hq.git
      ref: ${{ init.commit-sha }}

  - key: uv
    run: |
      curl -LsSf https://astral.sh/uv/install.sh | sh
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  - key: dagger-cli
    run: |
      curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR="$HOME/.local/bin" sh
      echo "$HOME/.local/bin" >> "$RWX_ENV/PATH"

  - key: linear-report
    use: [code, uv, dagger-cli]
    docker: true
    env:
      LINEAR_API_KEY: ${{ secrets.LINEAR_API_KEY }}
      LINEAR_TEAM: ${{ init.team }}
      REPORT_KEY: ${{ init.key }}
      REPORT_TITLE: ${{ init.title }}
      REPORT_BODY: ${{ init.body }}
    run: uv run dagger run python ci/main.py linear-report
