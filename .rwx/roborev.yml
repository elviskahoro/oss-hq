# RoboRev review as a tool for the local agent. Dispatch-only (cli trigger): it
# is not a PR check, posts no comment or status, and does not replace
# pullfrog-approval. Run it before pushing:
#   rwx run .rwx/roborev.yml --wait
# It reviews local work (committed or not) against origin/main with the model in
# .roborev.toml (pi + Kilo gateway) and fails when roborev reports findings.
# The logic lives in the elviskahoro/roborev package (rwx-packages/roborev).
on:
  cli:
    init:
      ref: ${{ event.git.sha }}
      branch: ${{ event.git.branch }}

# One review per branch: a new dispatch on the same branch replaces the stale run.
# Pool ids are global to the RWX org, so the repo name is part of the id.
concurrency-pools:
  - id: elviskahoro/oss-hq:roborev:${{ init.branch }}
    capacity: 1
    on-overflow: cancel-running

base:
  image: ubuntu:24.04
  config: rwx/base 1.2.0

tasks:
  - key: code
    call: git/clone 2.4.1
    cache: false
    with:
      repository: https://github.com/elviskahoro/oss-hq.git
      ref: ${{ init.ref }}
      submodules: false
      preserve-git-dir: true
      fetch-full-depth: true
      github-token: ${{ github['elviskahoro'].token }}

  - key: roborev
    use: code
    call: elviskahoro/roborev 1.0.0
    with:
      kilo-model: ${{ vaults.roborev.vars.KILO_MODEL }}
      kilo-base-url: ${{ vaults.roborev.vars.KILO_BASE_URL }}
      kilo-org-id: ${{ vaults.roborev.vars.KILO_ORG_ID }}
      kilo-context: ${{ vaults.roborev.vars.KILO_CONTEXT }}
      kilo-max-output: ${{ vaults.roborev.vars.KILO_MAX_OUTPUT }}
      kilo-api-key: ${{ vaults.roborev.secrets.KILO_API_KEY }}
      repository: elviskahoro/oss-hq
      github-token: ${{ github['elviskahoro'].token }}
