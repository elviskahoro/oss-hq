# Hand-maintained config read by the RWX roborev pipeline
# (`rwx run .rwx/roborev.yml --wait`, the only way roborev runs; see
# skills/roborev-rwx/SKILL.md). Reviews are blocking; no post-commit
# auto-review hook is used.
#
# Review with the pi agent via the Kilo gateway (KILO_API_KEY comes from the
# RWX `roborev` vault). The model line is only a default; .rwx/roborev.yml
# overrides it from the vault var KILO_MODEL.
agent = "pi"
model = "kilo/deepseek/deepseek-v4-flash"
